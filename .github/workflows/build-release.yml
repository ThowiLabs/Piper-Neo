name: Build Release Piper Neo
run-name: Build Release Piper Neo #${{ github.run_number }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag/version del release. Si se deja vacío, calcula la siguiente versión numérica."
        required: false
        default: ""
      prerelease:
        description: "Marcar como prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows-amd64:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build Piper Neo
        shell: cmd
        run: |
          py script\build-windows.py clean
          py script\build-windows.py

      - name: Smoke test binary
        shell: cmd
        run: |
          dist-winlibs\piper-neo-windows\piper.exe --help

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist-winlibs\piper-neo-windows\* -DestinationPath piper_windows_amd64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: piper_windows_amd64
          path: piper_windows_amd64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows-amd64
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: piper_windows_amd64
          path: release-artifacts

      - name: Resolve release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            last=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '^[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 || true)
            if [[ -z "${last}" ]]; then
              tag="1.0"
            else
              major="${last%%.*}"
              minor="${last##*.}"
              tag="${major}.$((minor + 1))"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--title "Piper Neo ${RELEASE_TAG}" --notes "Build Windows amd64 de Piper Neo." --target main)
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" "${flags[@]}"
          else
            gh release create "${RELEASE_TAG}" "${flags[@]}"
          fi
          gh release upload "${RELEASE_TAG}" release-artifacts/piper_windows_amd64.zip --clobber
