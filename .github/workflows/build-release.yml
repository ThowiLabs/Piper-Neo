name: Build Release Piper Neo
run-name: Build Release Piper Neo #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de release. Si se deja vacío, se calcula 1.0, 1.1, 1.2..."
        required: false
        type: string
      prerelease:
        description: "Marcar como prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows amd64
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build Windows package
        shell: pwsh
        run: |
          py script\build-windows.py clean
          py script\build-windows.py

      - name: Smoke binary help
        shell: pwsh
        run: |
          .\dist-winlibs\piper-neo-windows\piper.exe --help

      - name: Package artifact
        shell: pwsh
        run: |
          if (Test-Path piper_windows_amd64.zip) { Remove-Item piper_windows_amd64.zip -Force }
          Compress-Archive -Path dist-winlibs\piper-neo-windows\* -DestinationPath piper_windows_amd64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piper_windows_amd64
          path: piper_windows_amd64.zip

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: piper_windows_amd64
          path: release-assets

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$last" ]; then
            next="1.0"
          else
            major="${last%%.*}"
            minor="${last##*.}"
            next="$major.$((minor + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags="--latest"
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Piper Neo $TAG" $flags
          else
            gh release create "$TAG" --title "Piper Neo $TAG" --notes "Build manual de Piper Neo." $flags
          fi

          gh release upload "$TAG" release-assets/piper_windows_amd64.zip --clobber
