name: Build Release Piper Neo
run-name: Build Release Piper Neo #${{ github.run_number }} · main

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag/release exacto. Vacío = usar release vacío existente o crear siguiente versión numérica 1.1, 1.2, 1.3..."
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_BRANCH: main

jobs:
  build_windows:
    runs-on: windows-latest
    name: "Windows build: x64"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Install zstd
        shell: pwsh
        run: |
          vcpkg install zstd:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_INSTALL_PREFIX=_install/piper `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Piper Neo
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Install Piper Neo
        shell: pwsh
        run: |
          cmake --install build --config Release

      - name: Copy runtime DLLs
        shell: pwsh
        run: |
          $binDir = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin"
          if (Test-Path $binDir) {
            Copy-Item "$binDir/*.dll" "_install/piper/" -ErrorAction SilentlyContinue
          }

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          .\_install\piper\piper.exe --help

      - name: Package release artifact
        shell: pwsh
        run: |
          cd _install
          Compress-Archive -LiteralPath piper -DestinationPath piper_windows_amd64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: piper-windows-amd64
          path: _install/piper_windows_amd64.zip
          if-no-files-found: error

  release:
    name: Create or update GitHub release
    runs-on: ubuntu-latest
    needs:
      - build_windows
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Resolve main commit
        id: main_commit
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Normalize asset names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          cp release-assets/piper-windows-amd64/piper_windows_amd64.zip release-upload/piper_windows_amd64.zip

      - name: Resolve release version
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          MAIN_SHA: ${{ steps.main_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          asset_name="piper_windows_amd64.zip"
          requested="${INPUT_RELEASE_TAG:-}"

          normalize_numeric_tag() {
            local tag="$1"
            tag="${tag#v}"
            [[ "$tag" =~ ^[0-9]+\.[0-9]+$ ]] || return 1
            echo "$tag"
          }

          release_exists() {
            gh release view "$1" --repo "${GITHUB_REPOSITORY}" --json tagName >/dev/null 2>&1
          }

          release_has_asset() {
            local tag="$1"
            gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[]?.name' 2>/dev/null | grep -Fxq "$asset_name"
          }

          if [[ -n "$requested" ]]; then
            release_tag="$requested"
          else
            mapfile -t numeric_tags < <(
              gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName,isDraft,isPrerelease \
                --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
              | while read -r tag; do normalize_numeric_tag "$tag" || true; done \
              | sort -t. -k1,1n -k2,2n
            )

            if [[ ${#numeric_tags[@]} -eq 0 ]]; then
              release_tag="1.1"
            else
              latest="${numeric_tags[-1]}"
              if release_exists "$latest" && ! release_has_asset "$latest"; then
                release_tag="$latest"
              else
                major="${latest%%.*}"
                minor="${latest##*.}"
                release_tag="${major}.$((minor + 1))"
              fi
            fi
          fi

          release_title="Piper Neo ${release_tag}"
          {
            echo "release_tag=${release_tag}"
            echo "release_title=${release_title}"
            echo "release_notes<<EOF"
            echo "Build manual de Piper Neo desde main."
            echo ""
            echo "Commit: ${MAIN_SHA}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
            echo "Plataforma: Windows amd64"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        env:
          RELEASE_NOTES: ${{ steps.release_meta.outputs.release_notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.main_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.release_tag }}"
          title="${{ steps.release_meta.outputs.release_title }}"

          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$TARGET_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$tag" release-upload/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "$tag" release-upload/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$TARGET_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
          fi
