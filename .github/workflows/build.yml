name: Build Piper Neo
run-name: Build Piper Neo #${{ github.run_number }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-amd64:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build Piper Neo
        shell: cmd
        run: |
          py script\build-windows.py clean
          py script\build-windows.py

      - name: Smoke test binary
        shell: cmd
        run: |
          dist-winlibs\piper-neo-windows\piper.exe --help

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist-winlibs\piper-neo-windows\* -DestinationPath piper_windows_amd64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: piper_windows_amd64
          path: piper_windows_amd64.zip
          if-no-files-found: error
