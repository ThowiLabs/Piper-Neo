name: Build Piper Neo
run-name: Build Piper Neo #${{ github.run_number }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows amd64
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build Windows package
        shell: pwsh
        run: |
          py script\build-windows.py clean
          py script\build-windows.py

      - name: Smoke binary help
        shell: pwsh
        run: |
          .\dist-winlibs\piper-neo-windows\piper.exe --help

      - name: Package artifact
        shell: pwsh
        run: |
          if (Test-Path piper_windows_amd64.zip) { Remove-Item piper_windows_amd64.zip -Force }
          Compress-Archive -Path dist-winlibs\piper-neo-windows\* -DestinationPath piper_windows_amd64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piper_windows_amd64
          path: piper_windows_amd64.zip
